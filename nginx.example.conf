# 把 example.com、站点目录和 PHP-FPM socket 改成服务器实际值。
# 宝塔用户可以把 location 规则合并到网站的 Nginx 配置中。

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /www/wwwroot/yhlg-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # 只允许执行 api 目录第一层的 PHP 接口。
    location ~ ^/api/(?!config(?:\.dev|\.example)?\.php$|selftest\.php$)[a-z_]+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 其他位置的 PHP 一律不执行。
    location ~ \.php$ {
        return 404;
    }

    # 配置、源码库、SQL、部署文件和内部库不能通过网页下载。
    location ~* ^/(?:\.git|api/(?:config(?:\.dev|\.example)?\.php|schema\.sql|selftest\.php|lib/)|migrations/|deploy\.sh|nginx\.example\.conf|README\.md|DEPLOY\.md|部署清单\.md) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
